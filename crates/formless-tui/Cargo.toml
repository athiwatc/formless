[package]
name = "formless-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
directories.workspace = true
crossterm = "0.28"
formless-core = { path = "../formless-core" }
formless-protocol = { path = "../formless-protocol" }
formless-runtime = { path = "../formless-runtime" }
pulldown-cmark = { version = "0.13", default-features = false }
qrcode = { version = "0.14", default-features = false }
# Kitty takes PNG only: other image formats are transcoded (#881).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
serde_json.workspace = true
# Already locked; parse editor argv without invoking an implicit shell.
shlex = "2"
sha2.workspace = true
tokio.workspace = true
unicode-width = "0.2"
unicode-segmentation.workspace = true
# Already locked transitively; native file URLs encode Windows prefixes and reserved characters.
url = "2"
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
# Asking the terminal for its background colour (OSC 11) at start (#883).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Reuse the daemon's current-user/SYSTEM security descriptor for private drafts.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "markdown"
harness = false
