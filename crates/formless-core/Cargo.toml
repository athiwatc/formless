[package]
name = "formless-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["embedded-llm"]
# In-process session-naming model (candle, CPU). Without it, sessions are
# named heuristically from the first message.
embedded-llm = ["dep:candle-core", "dep:candle-transformers", "dep:tokenizers"]

[dependencies]
candle-core = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
aes-gcm.workspace = true
anyhow.workspace = true
base64.workspace = true
rand.workspace = true
sha2.workspace = true
hkdf.workspace = true
ignore.workspace = true
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rustls = { version = "0.23", features = ["ring"] }
tokio-tungstenite.workspace = true
chrono.workspace = true
directories.workspace = true
formless-protocol = { path = "../formless-protocol" }
formless-runtime = { path = "../formless-runtime" }
jsonschema.workspace = true
futures-util.workspace = true
keyring.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
toml_edit = "0.22"
tracing.workspace = true
uuid.workspace = true
axum = { version = "0.8", features = ["ws"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
