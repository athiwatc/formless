[package]
name = "formless-bin"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "formless"
path = "src/main.rs"

[dependencies]
base64.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3"
chrono.workspace = true
crossterm = "0.28"
unicode-width = "0.2"
regex = "1"
formless-core = { path = "../formless-core" }
formless-protocol = { path = "../formless-protocol" }
formless-tui = { path = "../formless-tui" }
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Already locked; parse documentation examples without running a shell.
shlex = "2"
formless-runtime = { path = "../formless-runtime" }
keyring.workspace = true

# Linux packages (packaging/README.md): `cargo deb -p formless-bin` and
# `cargo generate-rpm -p crates/formless` after a release build.
[package.metadata.deb]
name = "formless"
maintainer = "Athiwat Chunlakhan <731394+athiwatc@users.noreply.github.com>"
section = "utils"
priority = "optional"
# $auto: the shared libraries the binary links (libc, libdbus) from shlibdeps.
depends = "$auto, ca-certificates"
license-file = ["../../LICENSE", "0"]
extended-description = "Formless is an AI agent harness that builds the Tools it needs, keeps them, and improves them over time. One binary: TUI, daemon, CLI and web UI."
assets = [
    ["target/release/formless", "usr/bin/", "755"],
    ["../../target/formless.1", "usr/share/man/man1/formless.1", "644"],
    ["../../README.md", "usr/share/doc/formless/README.md", "644"],
]

[package.metadata.generate-rpm]
name = "formless"
# Requires: from the libraries the binary links.
auto-req = "builtin"
assets = [
    { source = "../../LICENSE", dest = "/usr/share/licenses/formless/LICENSE", mode = "644", doc = true },
    { source = "target/release/formless", dest = "/usr/bin/formless", mode = "755" },
    { source = "../../target/formless.1", dest = "/usr/share/man/man1/formless.1", mode = "644", doc = true },
    { source = "../../README.md", dest = "/usr/share/doc/formless/README.md", mode = "644", doc = true },
]

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
