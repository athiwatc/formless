# TEMPORARY DIAGNOSTIC BRANCH ONLY — never merge this workflow definition.
# A quiet, one-test Windows observation; not a full-suite/release baseline and
# not evidence that the failed 1e40 checkout or blocked #1240 is merge-ready.
name: release-baseline
on:
  workflow_dispatch:
    inputs:
      job_family:
        description: Temporary quiet Windows file-search diagnostic only
        type: choice
        required: true
        default: native
        options: [all, native]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: windows-quiet-files-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quiet-windows-file-search:
    if: ${{ inputs.job_family == 'all' || inputs.job_family == 'native' }}
    # Compile deadline only; the original test still enforces TWO SECONDS.
    timeout-minutes: 30
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fresh private Cargo and profile paths; verify exact source blob
        shell: pwsh
        run: |
          $ciCargoHome = Join-Path $env:RUNNER_TEMP 'quiet-files-cargo'
          $ciTarget = Join-Path $env:GITHUB_WORKSPACE 'target'
          if (Test-Path $ciCargoHome) { throw "Cargo home already exists; diagnostic must start fresh" }
          if (Test-Path $ciTarget) { throw "target already exists; diagnostic must start fresh" }
          New-Item -ItemType Directory -Path $ciCargoHome | Out-Null
          "CARGO_HOME=$ciCargoHome" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$ciTarget" >> $env:GITHUB_ENV
          "FORMLESS_DATA_DIR=$(Join-Path $env:RUNNER_TEMP 'quiet-files-data')" >> $env:GITHUB_ENV
          "FORMLESS_CONFIG_DIR=$(Join-Path $env:RUNNER_TEMP 'quiet-files-config')" >> $env:GITHUB_ENV
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) { throw "checkout differs from dispatched SHA" }
          # Recorded directly from 1e40fcc7377ad3177bc11106300d3d97f6db9472:crates/formless-core/src/files.rs.
          # Compare Git objects, never checkout bytes affected by Windows CRLF.
          $expectedFilesBlob = '5636bfb4736dd0de0860c9178631d7f85fa5bb70'
          $sourceBlob = git rev-parse 'HEAD:crates/formless-core/src/files.rs'
          if ($LASTEXITCODE -ne 0 -or $sourceBlob -ne $expectedFilesBlob) { throw "files.rs differs from the failed 1e40 source blob" }
          "SHA=$head files.rs=$sourceBlob runner=$env:RUNNER_OS arch=$env:RUNNER_ARCH image=$env:ImageOS version=$env:ImageVersion"
          "## Temporary quiet Windows diagnostic`nSHA: $head`nfiles.rs Git blob: $sourceBlob (identical to failed 1e40fcc7377ad3177bc11106300d3d97f6db9472).`nOnly the exact file-search test runs, at one harness thread, with its original two-second assertion untouched.`nFresh Cargo home/target; no restored cache. Toolchain/image/network caches are not claimed cold. This is not full-suite, release, or #1240 approval evidence." >> $env:GITHUB_STEP_SUMMARY
      - uses: dtolnay/rust-toolchain@stable
      - name: Record toolchain and verify fresh artifact paths
        shell: pwsh
        run: |
          $expected = Join-Path $env:RUNNER_TEMP 'quiet-files-cargo'
          if ([IO.Path]::GetFullPath($env:CARGO_HOME) -ne [IO.Path]::GetFullPath($expected)) { throw "toolchain setup changed the private Cargo home" }
          if (Test-Path (Join-Path $env:CARGO_HOME 'registry')) { throw "registry cache unexpectedly restored" }
          if (Test-Path $env:CARGO_TARGET_DIR) { throw "target cache unexpectedly restored" }
          rustc -Vv
          if ($LASTEXITCODE -ne 0) { throw "rustc version probe failed" }
          cargo --version
          if ($LASTEXITCODE -ne 0) { throw "Cargo version probe failed" }
      - name: Run only the unchanged exact two-second file-search oracle
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/windows-quiet-files.log"
          cargo test -p formless-core --lib files::tests::search_stays_fast_on_a_large_index --locked -- --exact --test-threads=1 2>&1 | tee "$log"
          python - "$log" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          name = 'files::tests::search_stays_fast_on_a_large_index'
          if not re.search(r'(?m)^test ' + re.escape(name) + r' \.\.\. ok\s*$', text):
              raise SystemExit('The exact named file-search oracle did not report success')
          if not re.search(r'(?m)^test result: ok\. 1 passed; 0 failed; 0 ignored;', text):
              raise SystemExit('Diagnostic must execute exactly one passing, non-ignored test')
          if not re.search(r'(?m)^running 1 test\s*$', text):
              raise SystemExit('A zero-test filter is not timing evidence')
          print('Verified: exactly one named test executed and passed; original two-second oracle unchanged.')
          PY
          printf '%s\n' 'Quiet exact file-search oracle: 1 passed. Limited one-test observation only.' >> "$GITHUB_STEP_SUMMARY"
