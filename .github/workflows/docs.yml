name: docs

on:
  pull_request:
    paths: ['README.md', 'SPEC.md', 'GLOSSARY.md', 'CHANGELOG.md', 'docs/**/*.md', '.github/workflows/docs.yml']
  push:
    branches: [main]
    paths: ['README.md', 'SPEC.md', 'GLOSSARY.md', 'CHANGELOG.md', 'docs/**/*.md', '.github/workflows/docs.yml']
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation links and anchors
        uses: lycheeverse/lychee-action@v2
        with:
          args: --include-fragments --accept 200,206,429 --max-retries 2 --timeout 20 README.md SPEC.md GLOSSARY.md CHANGELOG.md 'docs/**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
