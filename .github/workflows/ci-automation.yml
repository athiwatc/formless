name: CI automation

on:
  workflow_run:
    workflows: [CI, Optional desktop]
    types: [completed]
  pull_request_target:
    types: [ready_for_review]
    branches: [main]

permissions: {}

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3 &&
      github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - run: python3 scripts/ci_automation.py retry
        env:
          GH_TOKEN: ${{ github.token }}

  merge:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.id == github.event.repository.id) ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.id == github.event.repository.id)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: ci-merge-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
      cancel-in-progress: false
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - run: python3 scripts/ci_automation.py merge
        env:
          GH_TOKEN: ${{ github.token }}
