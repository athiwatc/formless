name: windows

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pipe:
    # Historical pipe-only 10m43s run predates debug=0/incremental=0 and CLI
    # coverage. Superseded sizing evidence; retain 22m provisionally until a
    # fresh expanded-job measurement for #1164 with this recipe.
    # https://github.com/athiwatc/formless/actions/runs/39622878988/job/119300605255
    timeout-minutes: 22
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Assertion inventory (review aid)
        run: python scripts/test-assertion-inventory.py
      - name: Storage before pipe tests
        shell: bash
        run: bash scripts/ci-storage-budget.sh snapshot before-pipe-tests
      - name: Named pipe security and round trip
        run: cargo test -p formless-core --test windows_pipe --locked
      - name: Production backup CLI and main-thread stack regression
        # Same existing job/22-minute bound; no test stack override. This runs
        # real default-stack child processes plus the production PE-header check.
        run: cargo test -p formless-bin --test backup_verification --locked
      - name: Final storage (including failed phases)
        if: always()
        shell: bash
        run: bash scripts/ci-storage-budget.sh snapshot job-finished
