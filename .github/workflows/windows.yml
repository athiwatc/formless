name: windows

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    # New independent scope: keep 30m provisional until a native green run
    # supplies duration evidence for #1164 with this exact storage recipe.
    name: Core library portability
    timeout-minutes: 30
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize private job directories
        shell: pwsh
        run: |
          $coreTarget = Join-Path $env:RUNNER_TEMP 'windows-core-target'
          $coreData = Join-Path $env:RUNNER_TEMP 'windows-core-data'
          $coreConfig = Join-Path $env:RUNNER_TEMP 'windows-core-config'
          foreach ($directory in @($coreTarget, $coreData, $coreConfig)) {
            if (Test-Path $directory) { throw "Private core directory already exists: $directory" }
            New-Item -ItemType Directory -Path $directory | Out-Null
          }
          "CARGO_TARGET_DIR=$coreTarget" >> $env:GITHUB_ENV
          "FORMLESS_DATA_DIR=$coreData" >> $env:GITHUB_ENV
          "FORMLESS_CONFIG_DIR=$coreConfig" >> $env:GITHUB_ENV
          "## Windows core library portability`nSHA: $env:GITHUB_SHA`nImage: $env:ImageOS $env:ImageVersion; architecture: $env:RUNNER_ARCH`nRecipe: debug=0, incremental=0, private fresh target/data/config; default test stacks. Thirty-minute bound is provisional pending native green duration." >> $env:GITHUB_STEP_SUMMARY
      - uses: dtolnay/rust-toolchain@stable
      - name: Core library tests (native Windows fixtures)
        run: cargo test -p formless-core --lib --locked

  pipe:
    # Historical pipe-only 10m43s run predates debug=0/incremental=0 and CLI
    # coverage. Superseded sizing evidence; retain 22m provisionally until a
    # fresh expanded-job measurement for #1164 with this recipe.
    # https://github.com/athiwatc/formless/actions/runs/39622878988/job/119300605255
    timeout-minutes: 22
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Assertion inventory (review aid)
        run: python scripts/test-assertion-inventory.py
      - name: Storage before pipe tests
        shell: bash
        run: bash scripts/ci-storage-budget.sh snapshot before-pipe-tests
      - name: Named pipe security and round trip
        run: cargo test -p formless-core --test windows_pipe --locked
      - name: Production backup CLI and main-thread stack regression
        # Same existing job/22-minute bound; no test stack override. This runs
        # real default-stack child processes plus the production PE-header check.
        run: cargo test -p formless-bin --test backup_verification --locked
      - name: Final storage (including failed phases)
        if: always()
        shell: bash
        run: bash scripts/ci-storage-budget.sh snapshot job-finished
