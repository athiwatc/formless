name: release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
env:
  RELEASE_ID: ${{ github.ref == 'refs/heads/main' && format('main-{0}', github.sha) || github.ref_name }}

# Never cancel a release halfway through publication.
concurrency:
  group: release-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: false

jobs:
  # No release workflow runs exist as of 2026-10-31, so build (60m) and
  # smoke/install (30m) limits are provisional, not measured 2x baselines.
  # Re-size each job from its first green cold build before treating the
  # duration-sizing acceptance criterion as complete.
  # Before any build (#842): the tag must have matching binaries and notes.
  version-check:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    outputs:
      prerelease: ${{ steps.tag-kind.outputs.prerelease }}
    timeout-minutes: 5
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/release-check.sh "$GITHUB_REF_NAME"
      - name: Tag is compatible with Docker version tags
        id: tag-kind
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 scripts/push-release-image.py --check-version
          case "$GITHUB_REF_NAME" in
            *-*) echo 'prerelease=true' ;;
            *) echo 'prerelease=false' ;;
          esac >> "$GITHUB_OUTPUT"
      - name: Tag has release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > /dev/null
  build:
    timeout-minutes: 60
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: [self-hosted, macOS, ARM64]
            target: aarch64-apple-darwin
            suffix: tar.gz
          - os: [self-hosted, macOS, X64]
            target: x86_64-apple-darwin
            suffix: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: zip
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create job-local Cargo and application directories
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/formless-release-cargo"
          {
            echo "CARGO_HOME=$RUNNER_TEMP/formless-release-cargo"
            echo "FORMLESS_DATA_DIR=$RUNNER_TEMP/formless-release-data"
            echo "FORMLESS_CONFIG_DIR=$RUNNER_TEMP/formless-release-config"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Storage before workspace tests
        shell: bash
        run: bash scripts/ci-storage-budget.sh snapshot before-tests
      - if: runner.os != 'Windows'
        run: cargo test --workspace --locked
      - name: Windows release smoke tests
        if: runner.os == 'Windows'
        run: |
          cargo test --locked -p formless-core --test windows_pipe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p formless-bin --bin formless cli_help_tests
      - name: Reclaim completed workspace test artifacts
        shell: bash
        run: bash scripts/ci-storage-budget.sh clean-debug
      - run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - name: Storage after release build
        shell: bash
        run: bash scripts/ci-storage-budget.sh snapshot release-built
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="formless-${RELEASE_ID}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/formless" "$name/"
          cp README.md SPEC.md LICENSE SECURITY.md "$name/"
          mkdir -p "$name/packaging" "$name/relay" "$name/crates/formless-desktop"
          cp GLOSSARY.md "$name/"
          cp -R docs "$name/"
          cp packaging/*.md "$name/packaging/"
          cp relay/*.md "$name/relay/"
          cp crates/formless-desktop/README.md "$name/crates/formless-desktop/"
          # The man page, from the target binary (or a host build when the
          # runner can't run the target).
          "target/${{ matrix.target }}/release/formless" man > "$name/formless.1" \
            || cargo run -q --release --locked --bin formless -- man > "$name/formless.1"
          # Optional signing: when the repository provides an Apple Developer ID
          # certificate via the standard signing secrets, sign here before notarization.
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "formless-$env:RELEASE_ID-${{ matrix.target }}"
          New-Item -ItemType Directory $name
          Copy-Item "target/${{ matrix.target }}/release/formless.exe" $name
          Copy-Item README.md,SPEC.md,LICENSE,SECURITY.md $name
          New-Item -ItemType Directory -Path "$name/packaging","$name/relay","$name/crates/formless-desktop" -Force | Out-Null
          Copy-Item GLOSSARY.md "$name"
          Copy-Item -Path docs -Destination "$name" -Recurse
          Copy-Item -Path packaging/*.md -Destination "$name/packaging"
          Copy-Item -Path relay/*.md -Destination "$name/relay"
          Copy-Item crates/formless-desktop/README.md "$name/crates/formless-desktop"
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File "$name.zip.sha256" -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formless-${{ matrix.target }}
          path: |
            formless-*.tar.gz
            formless-*.zip
            formless-*.sha256
          if-no-files-found: error
      - name: Final storage (including failed phases)
        if: always()
        shell: bash
        run: bash scripts/ci-storage-budget.sh snapshot job-finished
  # Linux archives and x86_64 native packages use Debian bullseye for
  # a glibc 2.31 floor (Debian 11+, Ubuntu 20.04+, RHEL/Rocky 9+).
  linux:
    timeout-minutes: 60
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: [self-hosted, Linux, X64]
            target: x86_64-unknown-linux-gnu
            artifact: formless-linux
            packages: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: formless-linux-arm64
            packages: false
    runs-on: ${{ matrix.os }}
    container: rust:1-bullseye
    env:
      FORMLESS_RELEASE_TARGET: ${{ matrix.target }}
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Record runner workspace owner before container writes
        shell: bash
        run: |
          test ! -L "$GITHUB_WORKSPACE"
          echo "CI_WORKSPACE_OWNER=$(stat -c '%u:%g' "$GITHUB_WORKSPACE")" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create job-local Cargo and application directories
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/formless-release-cargo"
          {
            echo "CARGO_HOME=$RUNNER_TEMP/formless-release-cargo"
            echo "FORMLESS_DATA_DIR=$RUNNER_TEMP/formless-release-data"
            echo "FORMLESS_CONFIG_DIR=$RUNNER_TEMP/formless-release-config"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/formless-release-cargo/bin" >> "$GITHUB_PATH"
      - name: Build dependencies
        run: apt-get update && apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Storage before workspace tests
        shell: bash
        run: bash scripts/ci-storage-budget.sh snapshot before-tests
      - run: cargo test --workspace --locked
      - name: Reclaim completed workspace test artifacts
        shell: bash
        run: bash scripts/ci-storage-budget.sh clean-debug
      - run: cargo build --release --locked --bin formless
      - name: Storage after release build
        shell: bash
        run: bash scripts/ci-storage-budget.sh snapshot release-built
      - run: target/release/formless man > target/formless.1
      - name: Generate package shell completions
        if: matrix.packages
        run: sh scripts/generate-package-completions.sh target/release/formless target/completions
      - name: Archive
        shell: bash
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          test "$host" = "$FORMLESS_RELEASE_TARGET"
          name="formless-${RELEASE_ID}-${FORMLESS_RELEASE_TARGET}"
          mkdir -p dist "$name"
          cp target/release/formless target/formless.1 README.md SPEC.md LICENSE SECURITY.md "$name/"
          mkdir -p "$name/packaging" "$name/relay" "$name/crates/formless-desktop"
          cp GLOSSARY.md "$name/"
          cp -R docs "$name/"
          cp packaging/*.md "$name/packaging/"
          cp relay/*.md "$name/relay/"
          cp crates/formless-desktop/README.md "$name/crates/formless-desktop/"
          tar -czf "dist/$name.tar.gz" "$name"
      - name: Install package-building tools with private intermediates
        if: matrix.packages
        shell: bash
        run: bash scripts/ci-storage-budget.sh install-package-tools
      - name: Packages
        if: matrix.packages
        shell: bash
        env:
          PRERELEASE: ${{ needs.version-check.outputs.prerelease }}
        run: |
          deb_version=()
          rpm_version=()
          asset_version=
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            package_id="$(cargo pkgid --locked -p formless-bin)"
            version="${package_id##*#}"
            version="${version##*@}"
            version="${version%%+*}"
            package_version="${version%%-*}~main.$GITHUB_RUN_NUMBER"
            asset_version="$RELEASE_ID"
          elif [[ "$PRERELEASE" == true ]]; then
            asset_version="${GITHUB_REF_NAME#v}"
            suffix="${asset_version#*-}"
            package_version="${asset_version%%-*}~${suffix//-/+}"
          fi
          if [[ -n "$asset_version" ]]; then
            deb_version=(--deb-version "$package_version-1")
            rpm_version=(--set-metadata "version=\"$package_version\"")
          fi
          cargo deb -p formless-bin --no-build --output target/debian/ "${deb_version[@]}"
          # --output recognizes directories only when they already exist.
          mkdir -p target/generate-rpm
          cargo generate-rpm -p crates/formless --output target/generate-rpm "${rpm_version[@]}"
          if [[ -n "$asset_version" ]]; then
            # Use the release ID's characters so checksum sidecars
            # match the downloaded names after GitHub's filename normalization.
            cp target/debian/*.deb "dist/formless_${asset_version}_amd64.deb"
            cp target/generate-rpm/*.rpm "dist/formless-${asset_version}.x86_64.rpm"
          else
            cp target/debian/*.deb target/generate-rpm/*.rpm dist/
          fi
          # The recorded dependencies, for the log.
          dpkg -I dist/*.deb | sed -n '/Depends/p'
      - name: Checksum release files
        shell: bash
        working-directory: dist
        run: for f in *; do sha256sum "$f" > "$f.sha256"; done
      - name: Install and run the ARM64 archive
        if: runner.arch == 'ARM64' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          fixtures="$(mktemp -d "$RUNNER_TEMP/formless-arm64.XXXXXX")"
          trap 'rm -rf -- "$fixtures"' EXIT
          mirror="$fixtures/releases/$GITHUB_REF_NAME"
          mkdir -p "$mirror"
          cp dist/*.tar.gz dist/*.tar.gz.sha256 "$mirror/"
          PREFIX="$fixtures/install" FORMLESS_VERSION="$GITHUB_REF_NAME" \
            FORMLESS_RELEASES_URL="file://$fixtures/releases" sh scripts/install.sh
          "$fixtures/install/bin/formless" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
      - name: Final storage (including failed phases)
        if: always()
        shell: bash
        run: bash scripts/ci-storage-budget.sh snapshot job-finished
      - name: Restore runner ownership of generated files
        if: always()
        shell: bash
        run: |
          # Container root must not strand files that the host checkout cannot clean.
          # Do not follow symlinks, change modes, or touch paths outside this job.
          test ! -L "$GITHUB_WORKSPACE"
          [[ "${CI_WORKSPACE_OWNER:-}" =~ ^[0-9]+:[0-9]+$ ]]
          chown -hRP "$CI_WORKSPACE_OWNER" "$GITHUB_WORKSPACE"
          for owned in "${CARGO_HOME:-}" "${FORMLESS_DATA_DIR:-}" "${FORMLESS_CONFIG_DIR:-}" "${INSTALL_FIXTURES:-}"; do
            case "$owned" in
              "$RUNNER_TEMP"/*)
                if [[ -e "$owned" || -L "$owned" ]]; then
                  chown -hRP "$CI_WORKSPACE_OWNER" "$owned"
                fi
                ;;
            esac
          done

  # Install each x86_64 native package in a clean system and run it.
  linux-install-test:
    timeout-minutes: 30
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:bookworm", "ubuntu:22.04", "rockylinux:9"]
    runs-on: [self-hosted, Linux, X64]
    container: ${{ matrix.image }}
    steps:
      - name: Record runner workspace owner before container writes
        shell: bash
        run: |
          test ! -L "$GITHUB_WORKSPACE"
          echo "CI_WORKSPACE_OWNER=$(stat -c '%u:%g' "$GITHUB_WORKSPACE")" >> "$GITHUB_ENV"
      - name: Allocate fresh install fixtures
        shell: bash
        run: |
          fixtures=$(mktemp -d "$RUNNER_TEMP/formless-install.XXXXXX")
          echo "INSTALL_FIXTURES=$fixtures" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: formless-linux
          path: ${{ env.INSTALL_FIXTURES }}
      - name: Install and run
        shell: bash
        working-directory: ${{ env.INSTALL_FIXTURES }}
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update && apt-get install -y ./*.deb
          else
            dnf install -y ./*.rpm
          fi
          formless --version
          test -f /usr/share/doc/formless/copyright || test -f /usr/share/licenses/formless/LICENSE
          for completion in \
            /usr/share/bash-completion/completions/formless \
            /usr/share/zsh/site-functions/_formless \
            /usr/share/fish/vendor_completions.d/formless.fish; do
            test -s "$completion"
            test "$(stat -c '%a' "$completion")" = 644
            if command -v dpkg-query >/dev/null; then
              dpkg-query -L formless | grep -Fx -- "$completion"
            else
              test "$(rpm -qf --qf '%{NAME}' "$completion")" = formless
            fi
          done
  # ghcr.io/athiwatc/formless (docs/docker.md): built, run and checked
  # before anything is pushed. linux/amd64 only (docs/docker.md).
      - name: Restore runner ownership of generated files
        if: always()
        shell: bash
        run: |
          # Container root must not strand files that the host checkout cannot clean.
          # Do not follow symlinks, change modes, or touch paths outside this job.
          test ! -L "$GITHUB_WORKSPACE"
          [[ "${CI_WORKSPACE_OWNER:-}" =~ ^[0-9]+:[0-9]+$ ]]
          chown -hRP "$CI_WORKSPACE_OWNER" "$GITHUB_WORKSPACE"
          for owned in "${CARGO_HOME:-}" "${FORMLESS_DATA_DIR:-}" "${FORMLESS_CONFIG_DIR:-}" "${INSTALL_FIXTURES:-}"; do
            case "$owned" in
              "$RUNNER_TEMP"/*)
                if [[ -e "$owned" || -L "$owned" ]]; then
                  chown -hRP "$CI_WORKSPACE_OWNER" "$owned"
                fi
                ;;
            esac
          done

  docker:
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.image-upload.outputs.artifact-id }}
      image-id: ${{ steps.smoke.outputs.image-id }}
      image: ${{ steps.image-identity.outputs.image }}
    env:
      RELEASE_IMAGE: formless:release-${{ github.run_id }}-${{ github.run_attempt }}
      RELEASE_CONTAINER: formless-release-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/v')
    # A failed build/test/install must prevent every public image tag update.
    needs: [version-check, build, linux, linux-install-test]
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Isolate Docker client configuration
        shell: bash
        run: |
          docker_config=$(mktemp -d "$RUNNER_TEMP/formless-docker-config.XXXXXX")
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: ${{ env.RELEASE_IMAGE }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke private container with positive RPC proof
        id: smoke
        shell: bash
        run: |
          image_id=$(docker image inspect --format '{{.Id}}' "$RELEASE_IMAGE")
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image_id")" = "$GITHUB_REF_NAME"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image_id")" = "$GITHUB_SHA"
          docker run --rm --network none "$image_id" --version
          docker run -d --network none --name "$RELEASE_CONTAINER" "$image_id"
          python3 - <<'PY'
          import json, os, subprocess, time
          name = os.environ["RELEASE_CONTAINER"]
          deadline = time.monotonic() + 30
          last = "no response"
          while time.monotonic() < deadline:
              remaining = deadline - time.monotonic()
              try:
                  response = subprocess.run(["docker", "exec", name, "formless", "daemon", "status", "--json"], capture_output=True, text=True, timeout=min(3, remaining))
                  last = response.stderr or response.stdout
                  if response.returncode == 0:
                      status = json.loads(response.stdout)
                      if type(status.get("pid")) is int and status["pid"] > 0 and status.get("version"):
                          print(response.stdout)
                          break
              except (subprocess.TimeoutExpired, json.JSONDecodeError) as error:
                  last = str(error)
              time.sleep(min(0.2, max(0, deadline - time.monotonic())))
          else:
              raise SystemExit("private container daemon never answered status within 30s: " + last)
          PY
          printf 'image-id=%s\n' "$image_id" >> "$GITHUB_OUTPUT"
      - name: Archive the smoke-tested image
        id: image-identity
        shell: bash
        env:
          TESTED_IMAGE_ID: ${{ steps.smoke.outputs.image-id }}
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Id}}' "$RELEASE_IMAGE")" = "$TESTED_IMAGE_ID"
          archive_dir=$(mktemp -d "$RUNNER_TEMP/formless-release-image.XXXXXX")
          echo "RELEASE_IMAGE_ARCHIVE=$archive_dir" >> "$GITHUB_ENV"
          docker image save --output "$archive_dir/image.tar" "$RELEASE_IMAGE"
          printf 'image=%s\n' "$RELEASE_IMAGE" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: image-upload
        with:
          name: docker-image-${{ github.run_attempt }}
          path: ${{ env.RELEASE_IMAGE_ARCHIVE }}/image.tar
          if-no-files-found: error
          retention-days: 7
      - name: Always remove owned smoke fixture
        if: always()
        shell: bash
        run: |
          if docker container inspect "$RELEASE_CONTAINER" >/dev/null 2>&1; then
            docker rm -fv "$RELEASE_CONTAINER"
          fi
          if docker image inspect "$RELEASE_IMAGE" >/dev/null 2>&1; then
            docker image rm "$RELEASE_IMAGE"
          fi
          if [[ -n "${RELEASE_IMAGE_ARCHIVE:-}" ]]; then
            rm -f -- "$RELEASE_IMAGE_ARCHIVE/image.tar"
            rmdir -- "$RELEASE_IMAGE_ARCHIVE"
          fi
  publish:
    permissions:
      contents: write
    outputs:
      release: ${{ steps.release.outcome }}
      tap: ${{ steps.tap.outcome }}
      winget: ${{ steps.winget.outcome }}
      aur: ${{ steps.aur.outcome }}
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v') && (needs.version-check.outputs.prerelease == 'true' || needs.version-check.outputs.prerelease == 'false')
    needs: [version-check, build, linux, linux-install-test, docker]
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: assets
          pattern: formless-*
          merge-multiple: true
      - name: Render Homebrew, AUR and winget files
        if: needs.version-check.outputs.prerelease == 'false'
        run: scripts/render-packaging.sh "${GITHUB_REF_NAME#v}" assets packaging-out
      # Notes `formless update` shows: the CHANGELOG section, then GitHub's
      # generated list of changes (#842).
      - name: Release notes
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        id: release
        with:
          body_path: release-notes.md
          prerelease: ${{ needs.version-check.outputs.prerelease }}
          make_latest: ${{ needs.version-check.outputs.prerelease == 'true' && 'false' || '' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            assets/formless-*.tar.gz
            assets/formless-*.zip
            assets/*.deb
            assets/*.rpm
            assets/*.sha256
            ${{ needs.version-check.outputs.prerelease == 'false' && 'packaging-out/aur/PKGBUILD' || '' }}
            ${{ needs.version-check.outputs.prerelease == 'false' && 'packaging-out/homebrew/formless.rb' || '' }}
            ${{ needs.version-check.outputs.prerelease == 'false' && 'packaging-out/winget/*.yaml' || '' }}
      # Each channel runs only when its secret exists (packaging/README.md),
      # independently of the others; the summary says how each went.
      - name: Update the Homebrew tap
        id: tap
        continue-on-error: true
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        if: needs.version-check.outputs.prerelease == 'false' && env.TAP_TOKEN != ''
        run: |
          # Never persist the tap token in .git/config on a self-hosted runner.
          askpass=$(mktemp "$RUNNER_TEMP/formless-tap-askpass.XXXXXX")
          trap 'rm -f -- "$askpass"' EXIT
          cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$TAP_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          git -c credential.helper= clone https://github.com/athiwatc/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp packaging-out/homebrew/formless.rb tap/Formula/formless.rb
          cd tap
          git config user.name "formless-release"
          git config user.email "731394+athiwatc@users.noreply.github.com"
          git add Formula/formless.rb
          # A re-run with nothing new is fine.
          if git diff --cached --quiet; then echo "tap already up to date"; exit 0; fi
          git commit -m "formless ${GITHUB_REF_NAME}"
          git -c credential.helper= push
      - name: Submit to winget
        id: winget
        continue-on-error: true
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        if: needs.version-check.outputs.prerelease == 'false' && env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: athiwatc.formless
          installers-regex: 'x86_64-pc-windows-msvc\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
      - name: Publish to the AUR
        id: aur
        continue-on-error: true
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_KEY }}
        if: needs.version-check.outputs.prerelease == 'false' && env.AUR_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: formless-bin
          pkgbuild: packaging-out/aur/PKGBUILD
          commit_username: formless-release
          commit_email: 731394+athiwatc@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
          commit_message: formless ${{ github.ref_name }}
  docker-publish:
    # All version tags share this group. Check the newest stable tag only
    # after admission, so a queued older run cannot roll back latest.
    concurrency:
      group: release-docker-publication
      queue: max
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.push.outputs.version }}
      latest: ${{ steps.push.outputs.latest }}
    timeout-minutes: 30
    needs: [docker, publish]
    if: needs.publish.outputs.release == 'success'
    runs-on: [self-hosted, Linux, X64]
    env:
      RELEASE_IMAGE: ${{ needs.docker.outputs.image }}
      TESTED_IMAGE_ID: ${{ needs.docker.outputs.image-id }}
      IMAGE_ARTIFACT_ID: ${{ needs.docker.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Isolate publication files and credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_IMAGE" =~ ^formless:release-[0-9]+-[0-9]+$ ]]
          [[ "$TESTED_IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          publish_dir=$(mktemp -d "$RUNNER_TEMP/formless-docker-publish.XXXXXX")
          echo "DOCKER_PUBLISH_DIR=$publish_dir" >> "$GITHUB_ENV"
          mkdir "$publish_dir/docker"
          echo "DOCKER_CONFIG=$publish_dir/docker" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ env.IMAGE_ARTIFACT_ID }}
          path: ${{ env.DOCKER_PUBLISH_DIR }}
          merge-multiple: true
      - name: Load the archived image
        shell: bash
        run: docker image load --input "$DOCKER_PUBLISH_DIR/image.tar"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          version: v0.31.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the verified image
        id: push
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: python3 scripts/push-release-image.py
      - name: Always remove owned publish fixture
        if: always() && env.DOCKER_PUBLISH_DIR != ''
        shell: bash
        run: |
          if docker image inspect "$RELEASE_IMAGE" >/dev/null 2>&1; then
            docker image rm "$RELEASE_IMAGE"
          fi
          # The login action uses this isolated config in its post step.
          rm -f -- "$DOCKER_PUBLISH_DIR/image.tar"

  channel-summary:
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: [version-check, publish, docker-publish]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Channel summary
        shell: bash
        env:
          RELEASE: ${{ needs.publish.outputs.release }}
          PRERELEASE: ${{ needs.version-check.outputs.prerelease }}
          TAP: ${{ needs.publish.outputs.tap }}
          WINGET: ${{ needs.publish.outputs.winget }}
          AUR: ${{ needs.publish.outputs.aur }}
          DOCKER: ${{ needs.docker-publish.result }}
          DOCKER_VERSION: ${{ needs.docker-publish.outputs.version }}
          DOCKER_LATEST: ${{ needs.docker-publish.outputs.latest }}
        run: bash scripts/release-channel-summary.sh "$RELEASE" "$TAP" "$WINGET" "$AUR" "$DOCKER"

  desktop:
    if: github.ref == 'refs/heads/main'
    needs: [build, linux]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            cli-artifact: formless-aarch64-apple-darwin
            archive: tar.gz
            installer: dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            cli-artifact: formless-x86_64-apple-darwin
            archive: tar.gz
            installer: dmg
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            cli-artifact: formless-linux
            archive: tar.gz
            installer: deb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cli-artifact: formless-x86_64-pc-windows-msvc
            archive: zip
            installer: exe
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      PACKAGE_TARGET: ${{ matrix.target }}
      PACKAGE_EXT: ${{ matrix.installer }}
      CLI_ARCHIVE: ${{ matrix.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          # Match crates/formless-desktop/notices/TOOLCHAIN.json.
          toolchain: 1.100.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.cli-artifact }}
          path: ${{ runner.temp }}/formless-desktop-${{ github.run_attempt }}/cli
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev libdbus-1-dev pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-xinput-dev libxcb-xkb-dev libxcb-cursor-dev libfontconfig1-dev libfreetype6-dev libvulkan-dev
      - name: Windows installer tooling
        if: runner.os == 'Windows'
        run: choco install nsis --yes --no-progress
      - name: Build locked desktop bundle and native installer
        env:
          PACKAGE_DIR: ${{ runner.temp }}/formless-desktop-${{ github.run_attempt }}
        run: python crates/formless-desktop/scripts/package-preview.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formless-desktop-${{ matrix.target }}
          path: ${{ runner.temp }}/formless-desktop-${{ github.run_attempt }}/release/*
          if-no-files-found: error

  publish-main:
    if: github.ref == 'refs/heads/main'
    needs: [build, linux, linux-install-test, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: assets
          pattern: formless-*
          merge-multiple: true
      - name: Tag the built commit without moving existing tags
        run: git push origin "HEAD:refs/tags/$RELEASE_ID"
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.RELEASE_ID }}
          name: Formless main (${{ github.sha }})
          body: Unsigned preview build from main. Desktop installers are not notarized or native-acceptance tested.
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            assets/formless-*.tar.gz
            assets/formless-*.zip
            assets/formless-*.deb
            assets/formless-*.rpm
            assets/formless-desktop-*.dmg
            assets/formless-desktop-*.exe
            assets/formless-*.sha256
