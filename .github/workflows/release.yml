name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            suffix: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            suffix: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="formless-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/formless" "$name/"
          cp README.md SPEC.md "$name/"
          # The man page, from the target binary (or a host build when the
          # runner can't run the target).
          "target/${{ matrix.target }}/release/formless" man > "$name/formless.1" \
            || cargo run -q --release --locked --bin formless -- man > "$name/formless.1"
          # Optional signing: when the repository provides an Apple Developer ID
          # certificate via the standard signing secrets, sign here before notarization.
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "formless-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory $name
          Copy-Item "target/${{ matrix.target }}/release/formless.exe" $name
          Copy-Item README.md,SPEC.md $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File "$name.zip.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: formless-${{ matrix.target }}
          path: |
            formless-*.tar.gz
            formless-*.zip
            formless-*.sha256
          if-no-files-found: ignore
  # .deb and .rpm (packaging/README.md).
  linux-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-deb cargo-generate-rpm --locked
      - run: cargo build --release --locked --bin formless
      - run: target/release/formless man > target/formless.1
      - name: Package
        run: |
          cargo deb -p formless-bin --no-build --output target/debian/
          cargo generate-rpm -p crates/formless -o target/generate-rpm/
          mkdir pkgs
          cp target/debian/*.deb target/generate-rpm/*.rpm pkgs/
          cd pkgs && for f in *; do shasum -a 256 "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: formless-linux-packages
          path: pkgs/*
  # ghcr.io/athiwatc/formless (docs/docker.md).
  docker:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/athiwatc/formless:${{ github.ref_name }}
            ghcr.io/athiwatc/formless:latest
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, linux-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Render Homebrew, winget and AUR files
        run: scripts/render-packaging.sh "${GITHUB_REF_NAME#v}" assets packaging-out
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/formless-*.tar.gz
            assets/formless-*.zip
            assets/*.deb
            assets/*.rpm
            assets/*.sha256
            packaging-out/aur/PKGBUILD
            packaging-out/homebrew/formless.rb
      # Publishing to the tap, winget and the AUR runs only when the
      # maintainer has set up their secrets (packaging/README.md).
      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/athiwatc/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp packaging-out/homebrew/formless.rb tap/Formula/formless.rb
          cd tap
          git config user.name "formless-release"
          git config user.email "731394+athiwatc@users.noreply.github.com"
          git add Formula/formless.rb
          git commit -m "formless ${GITHUB_REF_NAME}" && git push
      - name: Submit to winget
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: athiwatc.formless
          installers-regex: 'x86_64-pc-windows-msvc\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
      - name: Publish to the AUR
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_KEY }}
        if: env.AUR_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: formless-bin
          pkgbuild: packaging-out/aur/PKGBUILD
          commit_username: formless-release
          commit_email: 731394+athiwatc@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
          commit_message: formless ${{ github.ref_name }}
