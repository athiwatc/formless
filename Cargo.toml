[workspace]
resolver = "2"
members = [
    "crates/formless-protocol",
    "crates/formless-core",
    "crates/formless-runtime",
    "crates/formless-tui",
    "crates/formless",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"
description = "A tool-building AI agent harness"
homepage = "https://formless.athiwat.xyz"
repository = "https://github.com/athiwatc/formless"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "5"
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.10"
sha2 = "0.10"
hkdf = "0.12"
base64 = "0.22"
rand = "0.8"
zeroize = "1"
unicode-segmentation = "1"
unicode-normalization = "0.1"
regex = "1"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rquickjs = "0.14"
jsonschema = "0.59"
candle-core = "0.11"
candle-transformers = "0.11"
ignore = "0.4"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
